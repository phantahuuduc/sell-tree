<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Đăng Ký Tài Khoản — Tiệm Cây Lá & Sỏi</title>
  <meta name="description" content="Đăng ký tài khoản Lá & Sỏi để mua cây cảnh và nhận hướng dẫn chăm sóc thực vật qua email.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;1,400&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script type="importmap">
    {
      "imports": {
        "axios": "https://esm.sh/axios@1.7.9"
      }
    }
  </script>
</head>
<body class="page-auth">
  <div class="auth">
    <div class="auth__visual">
      <img src="assets/img/p6.jpg" alt="Sen đá kim cương rạng rỡ" width="800" height="1000">
      <figcaption>
        <em>Echeveria agavoides</em>
        <span>Nhận phiếu theo dõi sức khỏe cây cảnh hàng tháng khi đăng ký.</span>
      </figcaption>
    </div>

    <main class="auth__main" id="mainContent">
      <div class="auth__top">
        <a class="brand" href="index.html">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          <span class="brand__text">Lá & Sỏi</span>
        </a>
        <a class="auth__back" href="index.html">← Về trang chủ</a>
      </div>

      <div class="auth__card">
        <h1>Tạo tài khoản</h1>
        <p>Đăng ký để lưu lịch sử chọn cây và địa chỉ nhận hàng.</p>

        <div class="form-summary" id="formSummary" role="alert" hidden></div>

        <form class="auth__form" id="registerForm" novalidate>
          <div class="field">
            <label for="name">Họ và tên người trồng</label>
            <input type="text" id="name" name="name" placeholder="Nguyễn Văn An" autocomplete="name" required>
            <div class="field__error" id="nameError" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" name="email" placeholder="an@gmail.com" autocomplete="email" required>
            <div class="field__error" id="emailError" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" name="phone" placeholder="0912 345 678" autocomplete="tel">
            <div class="field__error" id="phoneError" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="address">Địa chỉ nhận hàng</label>
            <input type="text" id="address" name="address" placeholder="Số nhà, đường, phường, quận, thành phố" autocomplete="street-address">
            <div class="field__error" id="addressError" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
            <div class="pw-meter"><span class="pw-meter__bar pw-meter__bar--empty"></span></div>
            <div class="pw-meter__text" id="pwStrengthText" aria-live="polite"></div>
            <div class="field__error" id="passwordError" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="confirmPassword">Xác nhận lại mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
            <div class="field__error" id="confirmError" aria-live="polite"></div>
          </div>

          <button class="btn btn--primary" id="submitBtn" type="submit">Đăng ký</button>
        </form>

        <p class="auth__switch">
          Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
